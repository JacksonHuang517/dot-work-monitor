[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotsignal"
version = "0.1.1"
description = "Cloud events for ChatGPT Dot: Feishu messages, tasks, calendars and NetEase email headers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["aiohttp==3.14.5", "cryptography==50.0.2"]

[project.scripts]
dotsignal = "dot_feishu.server:main"

[tool.setuptools.packages.find]
include = ["dot_feishu*"]
