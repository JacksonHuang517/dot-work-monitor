[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dot-work-monitor"
version = "0.1.0"
description = "Self-hosted read-only Feishu and NetEase IMAP monitoring with MCP Events for ChatGPT dots"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["aiohttp==3.14.5", "cryptography==50.0.2"]

[project.scripts]
dot-work-monitor = "dot_feishu.server:main"

[tool.setuptools.packages.find]
include = ["dot_feishu*"]
